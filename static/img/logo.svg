<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card 1 (Lion Gold) -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Card 2 (Film Cyan) -->
    <linearGradient id="cardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card 3 (Music Emerald) -->
    <linearGradient id="cardEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Icon -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Gloss Highlight -->
  <path d="M 24 136 C 24 64, 64 24, 136 24 L 376 24 C 448 24, 488 64, 488 136 C 488 160, 420 220, 256 220 C 92 220, 24 160, 24 136 Z" fill="#ffffff" opacity="0.15" />

  <!-- Back Card: Music (Emerald) tilted right -->
  <g transform="translate(256, 256) rotate(16) translate(-256, -256)" filter="url(#shadow)">
    <rect x="200" y="110" width="160" height="230" rx="20" fill="url(#cardEmerald)" stroke="#ffffff" stroke-width="6" />
    <text x="280" y="240" font-size="76" text-anchor="middle" fill="#ffffff" filter="url(#glow)">🎵</text>
  </g>

  <!-- Left Card: Movie (Cyan) tilted left -->
  <g transform="translate(256, 256) rotate(-16) translate(-256, -256)" filter="url(#shadow)">
    <rect x="152" y="110" width="160" height="230" rx="20" fill="url(#cardCyan)" stroke="#ffffff" stroke-width="6" />
    <text x="232" y="240" font-size="76" text-anchor="middle" fill="#ffffff" filter="url(#glow)">🎬</text>
  </g>

  <!-- Front Center Card: Animal King (Gold) upright -->
  <g filter="url(#shadow)">
    <rect x="176" y="146" width="160" height="230" rx="20" fill="url(#cardGold)" stroke="#ffffff" stroke-width="7" />
    <text x="256" y="278" font-size="84" text-anchor="middle" fill="#ffffff" filter="url(#glow)">🦁</text>
    <!-- Little corner crowns -->
    <text x="194" y="180" font-size="22" fill="#ffffff">👑</text>
    <text x="318" y="360" font-size="22" fill="#ffffff">👑</text>
  </g>

  <!-- Sparkles & Confetti Elements -->
  <!-- Top Left Star -->
  <path d="M 100 90 Q 115 105 130 90 Q 115 75 100 90 Z" fill="#fde047" filter="url(#glow)" />
  <circle cx="90" cy="150" r="10" fill="#f472b6" />
  <circle cx="410" cy="110" r="12" fill="#fde047" />

  <!-- Bottom Right Star -->
  <circle cx="410" cy="380" r="10" fill="#38bdf8" />
  <polygon points="380,420 388,438 406,442 392,454 396,472 380,462 364,472 368,454 354,442 372,438" fill="#fde047" />

  <!-- Banner at the bottom: "PARTY PLAY" -->
  <g transform="translate(0, 390)" filter="url(#shadow)">
    <!-- Pill background -->
    <rect x="106" y="10" width="300" height="66" rx="33" fill="#ffffff" stroke="#f1f5f9" stroke-width="3" />
    <text x="256" y="54" font-family="'Outfit', -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="3" text-anchor="middle" fill="#0f172a">
      PARTY PLAY
    </text>
    <!-- Accent dot -->
    <circle cx="376" cy="42" r="5" fill="#db2777" />
  </g>
</svg>
